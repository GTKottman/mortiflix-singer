[package]
name = "mortiflix-singer"
version = "0.1.1"
description = "Mortiflix Singer: an open singing voice synthesizer"
authors = ["Mortiflix"]
license = "AGPL-3.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
httparse = "1"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
